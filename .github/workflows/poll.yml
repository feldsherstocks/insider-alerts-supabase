name: Insider Trading Alert Poll (Supabase)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run alert script
        id: run_alert
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python alert.py

      - name: Update market caps
        id: update_market_cap
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python update_market_cap.py

      - name: Copy significant trades
        id: copy_significant
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python copy_significant_trades.py

      - name: Commit updated state
        id: commit_state
        if: always()
        continue-on-error: true
        run: |
          git config user.name "insider-alert-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen filings"
          git push

      # If any earlier step failed, fail the job now so GitHub shows a red X.
      - name: Check for failures
        if: always()
        run: |
          if [ "${{ steps.run_alert.outcome }}" = "failure" ] || \
             [ "${{ steps.update_market_cap.outcome }}" = "failure" ] || \
             [ "${{ steps.copy_significant.outcome }}" = "failure" ] || \
             [ "${{ steps.commit_state.outcome }}" = "failure" ]; then
            echo "One or more steps failed."
            exit 1
          fi
